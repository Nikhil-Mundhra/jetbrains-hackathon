# Project version
version=1.0.0

# Kotlin version
kotlin.version=2.0.0

# Compose version
compose.version=1.6.10

# Android
android.compileSdk=34
android.minSdk=24
android.targetSdk=34
android.useAndroidX=true

# JVM
jvm.target=17

# KMP
kmp.enabled=true

# Memory settings for Kotlin Wasm compilation
# JVM args only — org.gradle.java.home intentionally omitted so Gradle
# resolves the JDK from JAVA_HOME (set by actions/setup-java in CI).
# Developers on machines with a newer default JDK (e.g. 26+) should set:
#   org.gradle.java.home=/path/to/jdk21
# in the gitignored local.properties file. Kotlin 2.0.x requires JDK <= 21.
org.gradle.jvmargs=-Xmx6g -XX:+UseParallelGC
kotlin.daemon.jvmargs=-Xmx6g
kotlin.jvm.target.validation.mode=warning
